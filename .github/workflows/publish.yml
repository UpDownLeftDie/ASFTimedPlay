name: Plugin-publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Existing GitHub release tag to upload this build into (e.g. 4.0.0.0). Leave empty when not attaching."
        required: false
        default: ""
        type: string

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0
  # ASF major line this branch targets (asset name ASFTimedPlay-V6.zip)
  ASF_MAJOR: "6"
  GPG_PRIVATE_KEY: ${{ secrets.ARCHIBOT_GPG_PRIVATE_KEY }} # Optional, if secret not provided, will skip signing SHA512SUMS with GPG key. You can specify your own credentials if you'd like to, simply change ARCHIBOT_GPG_PRIVATE_KEY here to the one you want to use

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    outputs:
      PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Verify .NET Core
        run: dotnet --info

      - name: Parse plugin name from Directory.Build.props
        id: plugin-name
        uses: mavrosxristoforos/get-xml-info@afaa5058ead44cfaff92c6a861b46dd7a8929f60 # 2.0
        with:
          xml-file: "Directory.Build.props"
          xpath: "//PluginName"

      - name: Publish plugin on Unix
        if: startsWith(matrix.os, 'macos-') || startsWith(matrix.os, 'ubuntu-')
        env:
          PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}
        shell: sh
        run: |
          set -eu

          dotnet publish "$PLUGIN_NAME" -c "$CONFIGURATION" -o "out/plugin/${PLUGIN_NAME}" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo

          # By default use fastest compression
          seven_zip_args="-mx=1"
          zip_args="-1"

          # Include extra logic for builds marked for release
          case "$GITHUB_REF" in
              "refs/tags/"*)
                  # Tweak compression args for release publishing
                  seven_zip_args="-mx=9 -mfb=258 -mpass=15"
                  zip_args="-9"
                  ;;
          esac

          # Versioned asset so ASF can pick V6 vs V7 from the same GitHub release
          PLUGIN_ZIP_NAME="${PLUGIN_NAME}-V${ASF_MAJOR}.zip"

          # Create the final zip file
          case "$(uname -s)" in
              "Darwin")
                  # We prefer to use zip on OS X as 7z implementation on that OS doesn't handle file permissions (chmod +x)
                  if command -v zip >/dev/null; then
                      (
                          cd "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}"
                          zip -q -r $zip_args "../../${PLUGIN_ZIP_NAME}" .
                      )
                  else
                      7z a -bd -slp -tzip -mm=Deflate $seven_zip_args "out/${PLUGIN_ZIP_NAME}" "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}/*"
                  fi
                  ;;
              *)
                  if command -v 7z >/dev/null; then
                      7z a -bd -slp -tzip -mm=Deflate $seven_zip_args "out/${PLUGIN_ZIP_NAME}" "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}/*"
                  else
                      (
                          cd "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}"
                          zip -q -r $zip_args "../../${PLUGIN_ZIP_NAME}" .
                      )
                  fi
                  ;;
          esac

      - name: Publish plugin on Windows
        if: startsWith(matrix.os, 'windows-')
        env:
          PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          Set-Location "$env:GITHUB_WORKSPACE"

          dotnet publish "$env:PLUGIN_NAME" -c "$env:CONFIGURATION" -o "out\plugin\$env:PLUGIN_NAME" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo

          if ($LastExitCode -ne 0) {
              throw "Last command failed."
          }

          # By default use fastest compression
          $compressionArgs = '-mx=1'

          # Include extra logic for builds marked for release
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              # Tweak compression args for release publishing
              $compressionArgs = '-mx=9', '-mfb=258', '-mpass=15'
          }

          # Versioned asset so ASF can pick V6 vs V7 from the same GitHub release
          $pluginZipName = "$env:PLUGIN_NAME-V$env:ASF_MAJOR.zip"

          # Create the final zip file
          7z a -bd -slp -tzip -mm=Deflate $compressionArgs "out\$pluginZipName" "$env:GITHUB_WORKSPACE\out\plugin\$env:PLUGIN_NAME\*"

          if ($LastExitCode -ne 0) {
              throw "Last command failed."
          }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          compression-level: 1
          if-no-files-found: error
          name: ${{ matrix.os }}_${{ steps.plugin-name.outputs.info }}
          path: out/${{ steps.plugin-name.outputs.info }}-V${{ env.ASF_MAJOR }}.zip

  release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.attach_to_release != '') }}
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Download plugin artifact from ubuntu-latest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ubuntu-latest_${{ needs.publish.outputs.PLUGIN_NAME }}
          path: out

      - name: Import GPG key for signing
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        if: ${{ env.GPG_PRIVATE_KEY != null }}
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}

      - name: Generate SHA-512 checksums and signature
        shell: sh
        run: |
          set -eu

          (
              cd "out"

              sha512sum *.zip > SHA512SUMS

              if [ -n "$GPG_PRIVATE_KEY" ]; then
                  gpg -a -b -o SHA512SUMS.sign SHA512SUMS
              fi
          )

      - name: Upload SHA512SUMS
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          compression-level: 1
          if-no-files-found: error
          name: SHA512SUMS
          path: out/SHA512SUMS

      - name: Upload SHA512SUMS.sign
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ env.GPG_PRIVATE_KEY != null }}
        with:
          compression-level: 1
          if-no-files-found: error
          name: SHA512SUMS.sign
          path: out/SHA512SUMS.sign

      - name: Create or update GitHub release (tag push)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "out/*"
          bodyFile: .github/RELEASE_TEMPLATE.md
          immutableCreate: true
          makeLatest: false
          name: ${{ needs.publish.outputs.PLUGIN_NAME }} V${{ github.ref_name }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true
          replacesArtifacts: false

      - name: Attach build to existing release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.attach_to_release }}
          PLUGIN_NAME: ${{ needs.publish.outputs.PLUGIN_NAME }}
          ASF_MAJOR: ${{ env.ASF_MAJOR }}
        shell: sh
        run: |
          set -eu
          # Upload only this branch's versioned zip so we do not clobber the other line's SHA512SUMS/zip
          gh release upload "$RELEASE_TAG" "out/${PLUGIN_NAME}-V${ASF_MAJOR}.zip" --clobber
